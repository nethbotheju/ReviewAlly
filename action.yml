name: 'ReviewAlly'
description: 'ReviewAlly — AI-powered pull request code review. Bring your own model & API key (OpenAI, OpenAI-compatible, or Anthropic). Two review modes: fast diff review, or agent investigation. Triggered by a label, slash command, or automatically.'
author: 'nethbotheju'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  api-type:
    description: 'LLM API protocol: openai | openai-chat-compatible | anthropic. Can be set with the REVIEWALLY_API_TYPE repository variable instead.'
    required: false
  api-key:
    description: 'API key for the LLM provider (BYOK). Store this in a secret.'
    required: true
  base-url:
    description: 'Base URL of the API. Required for openai-chat-compatible. Optional override for openai/anthropic. Can be set with the REVIEWALLY_BASE_URL repository variable instead.'
    required: false
  model:
    description: 'Model identifier to use for the review (e.g. gpt-4o, claude-sonnet-4-5). Can be set with the REVIEWALLY_MODEL repository variable instead.'
    required: false

  github-token:
    description: 'GitHub token used to read the PR and post the review. Defaults to the automatic workflow token.'
    required: false
    default: ${{ github.token }}
  app-token-url:
    description: 'Endpoint of a ReviewAlly token minter (see minter/README.md). When set, the review is posted with the ReviewAlly GitHub App identity (custom name + logo) instead of github-actions[bot]. Consumers only need the App installed — no secrets. Falls back to the workflow identity if the App is not installed.'
    required: false
    default: ''

  trigger-comment:
    description: 'Slash command that triggers a review on a PR comment (case-insensitive).'
    required: false
    default: '/reviewally'
  trigger-label:
    description: 'PR label that triggers a review when added.'
    required: false
    default: 'reviewally'
  auto-review:
    description: 'When true, also review automatically on PR open/reopen/push (synchronize) without a label or command. Can be set with the REVIEWALLY_AUTO_REVIEW repository variable instead.'
    required: false

  max-files:
    description: 'Maximum number of changed files to review per run (standard mode only; agent mode reviews all changed files).'
    required: false
    default: '20'
  max-diff-lines:
    description: 'Maximum total added lines to review per run, protecting the token budget (standard mode only; agent mode reads diffs on demand via get_diff).'
    required: false
    default: '3000'
  use-default-excludes:
    description: 'Apply the built-in excludes for lockfiles, minified files, and sourcemaps. Build artifacts, dependencies, and VCS metadata are always excluded regardless of this setting.'
    required: false
    default: 'true'

  # Agent-mode inputs
  review-mode:
    description: 'Review mode: standard (single prompt) or agent (tool-enabled investigation loop). Can be set with the REVIEWALLY_REVIEW_MODE repository variable instead.'
    required: false
  agent-tarball-max-mb:
    description: 'Maximum tarball size in MB for the repo snapshot (agent mode). Larger repos degrade to standard mode.'
    required: false
    default: '200'
  pi-version:
    description: 'Version of @earendil-works/pi-coding-agent to install for agent mode (e.g. 1.0.0, latest).'
    required: false
    default: '1.0.0'
  pi-timeout-ms:
    description: 'Hard timeout in milliseconds for a pi-engine review run. Guards against runaway loops since pi has no built-in step cap.'
    required: false
    default: '600000'
  pi-log:
    description: "Agent-mode run visibility in the Actions log: off, compact (one line per tool call / message), or full (larger previews). The raw JSONL transcript is always saved to RUNNER_TEMP and dumped in a collapsed group on failure."
    required: false
    default: 'compact'
  pi-thinking:
    description: "Agent-mode thinking level passed to pi (off, minimal, low, medium, high, xhigh, max). Set low (or higher) when the model cannot disable reasoning — otherwise it runs at the provider's default effort, which can dominate run time."
    required: false
    default: 'off'

outputs:
  summary:
    description: 'The plain-text review summary produced by the model.'

runs:
  using: 'node24'
  main: 'dist/index.js'
