name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run bundle
      - name: Verify dist is up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run bundle' and commit the result."
            git status --porcelain dist
            exit 1
          fi

  pi-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pi-version: ['0.82.1', '1.0.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm install --prefix "$RUNNER_TEMP/pi-smoke" --ignore-scripts --no-audit --no-fund "@earendil-works/pi-coding-agent@${{ matrix.pi-version }}"
      - run: npx vitest run src/modes/agent/pi-integration.test.ts
        env:
          REVIEWALLY_TEST_PI_CLI: ${{ runner.temp }}/pi-smoke/node_modules/@earendil-works/pi-coding-agent/dist/cli.js
